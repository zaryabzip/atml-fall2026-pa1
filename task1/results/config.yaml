seed: 6304
device: auto
dataset: stl10
data:
  val_fraction: 0.2
  eval_subset_size: 500
backbones:
- resnet50
- vit_b16
- clip_b32
feature_batch: 64
head:
  max_epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  patience: 5
  batch_size: 256
clip_zero_shot:
  template: a photo of a {}.
interventions:
  extra_color:
    kind: hue_rotation
    hue_factor: 0.3
  translations:
  - 0
  - 8
  - 16
  - 32
  patch_grid: 4
cue_conflict:
  class_pairs:
  - - cat
    - truck
  - - dog
    - airplane
  - - bird
    - car
  - - horse
    - ship
  - - monkey
    - deer
  min_valid: 200
  style_strength: 0.75
representation:
  method: tsne
  tsne_perplexity: 30
  umap_neighbors: 15
  umap_min_dist: 0.1
