_base_: base.yaml
run_name: dann
method:
  name: dann
  max_grl: 1.0            # design study: 0.25 / 0.5 / 1.0
  grl_gamma: 10.0         # alpha(p) = max_grl * (2 / (1 + exp(-gamma p)) - 1)
  domain_loss_weight: 1.0
  disc_hidden: 256
  disc_dropout: 0.5
  disc_input_norm: true   # LayerNorm before the discriminator; stops feature blow-up (see report, deviations)
  disc_lr_mult: 1.0       # 10.0 was tried as an extra attempt (task2/results/disc_lr_decision.txt)
